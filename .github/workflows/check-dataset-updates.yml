name: Check Dataset Updates

on:
  schedule:
    # 매일 오전 9시 (KST) = UTC 0시.
    # 데이터 자체는 분기 갱신이지만, 등록일이 예정일보다 며칠 밀리거나 당겨지므로
    # 매일 확인한다. 확인은 페이지 한 번 읽는 것이라 비용이 없다.
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행

# 예약 실행과 수동 실행이 겹치면 상태 파일 커밋이 서로 밀린다.
concurrency:
  group: check-dataset-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 상태 파일을 되커밋해야 하므로 쓰기 권한이 필요하다.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check dataset updates
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python check_filedata_changes.py

      # 상태 파일이 곧 '지난번에 본 값' 이다. 되돌려 커밋하지 않으면 매 실행이 첫
      # 실행이 되어 갱신을 영영 감지하지 못한다.
      #
      # 변경이 없는 날에도 last_check 가 바뀌어 커밋이 남는다. 일부러 그대로 둔다 —
      # GitHub 은 60일 동안 활동이 없는 저장소의 예약 워크플로를 꺼버리는데, 이
      # 데이터는 분기에 한 번만 바뀌므로 그 사이에 감시가 멈춘다.
      - name: Commit state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f filedata_state.json ]; then git add -- filedata_state.json; fi
          git diff --staged --quiet || {
            git commit -m "chore: update dataset state [skip ci]"
            git push
          }
