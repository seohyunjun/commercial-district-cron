name: Check Dataset Updates

on:
  schedule:
    # 매일 오전 9시 (KST) = UTC 0시.
    # 데이터 자체는 분기 갱신이지만, 등록일이 예정일보다 며칠 밀리거나 당겨지므로
    # 매일 확인한다. 확인은 페이지 한 번 읽는 것이라 비용이 없다.
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행

# 예약 실행과 수동 실행이 겹치면 상태 파일 커밋이 서로 밀린다.
concurrency:
  group: check-dataset-updates
  cancel-in-progress: false

# data.go.kr 은 일부 리전의 러너에서 오는 연결을 받지 않는다(연결 타임아웃).
# 러너는 job 마다 새로 배정되므로, 실패하면 다른 종류의 러너로 옮겨 다시 시도한다.
jobs:
  x64:
    uses: ./.github/workflows/_check.yml
    with:
      runner: ubuntu-latest
      last-attempt: false
    secrets: inherit
    permissions:
      contents: write

  arm:
    needs: x64
    if: needs.x64.outputs.outcome != 'success'
    uses: ./.github/workflows/_check.yml
    with:
      runner: ubuntu-24.04-arm
      last-attempt: false
    secrets: inherit
    permissions:
      contents: write

  macos:
    needs: arm
    if: needs.arm.outputs.outcome == 'failure'
    uses: ./.github/workflows/_check.yml
    with:
      runner: macos-latest
      last-attempt: true
    secrets: inherit
    permissions:
      contents: write
